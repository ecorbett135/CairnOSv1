services:
  cairnos-api:
    build:
      context: .
      dockerfile: Dockerfile.asgi
    image: cairnos-api:local
    environment:
      CAIRNOS_API_MAX_BODY_BYTES: "32768"
      CAIRNOS_BUILD_SHA: local-asgi-container
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
